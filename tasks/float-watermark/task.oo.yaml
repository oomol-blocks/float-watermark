ui:
  default_width: 450
inputs_def:
  - handle: media
    description: Video file to be processed
    json_schema:
      type: string
      ui:widget: file
  - handle: text
    description: Watermark text content
    json_schema:
      type: string
  - handle: outputDir
    description: Output directory for processed video
    json_schema:
      type: string
      ui:widget: dir
    nullable: false
  - group: Group
  - handle: count
    json_schema:
      type: number
    value: 1
    description:
      Number of floating watermarks to generate (default: 1)
  - handle: color
    description: Watermark text color
    json_schema:
      type: string
      ui:widget: color
      ui:options:
        colorType: HEX
    value: "#FFFFFF"
  - handle: opacity
    description: Watermark transparency (0-1)
    json_schema:
      type: number
    value: 0.8
  - handle: fontSize
    description: Watermark font size (12-72 pixels)
    json_schema:
      type: number
    value: 40
outputs_def:
  - handle: media
    description: Processed video file with floating watermarks
    json_schema:
      type: string
      ui:widget: file
executor:
  name: nodejs
  options:
    entry: main.ts
    spawn: false
title: float-watermark
icon: ":carbon:flow-data:"
description: "Adds intelligent floating watermarks to videos with customizable
  text, color, and movement patterns. Watermarks move dynamically across the
  video using different trajectories to provide effective content protection
  against piracy and unauthorized use."
